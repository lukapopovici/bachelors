[project]
name = "msv-med"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "httpx==0.27.0",
    "pydicom==2.4.4",
    "celery==5.3.6",
    "redis==5.0.4",
    "pydantic==2.7.1",
    "python-multipart==0.0.9",
    "sqlalchemy==2.0.32",
    "pgvector==0.2.5",
    "psycopg2-binary==2.9.9",
    "fastembed==0.3.5",
    "numpy==1.26.4",
    "bcrypt<5",
    "python-jose[cryptography]",
    "prometheus-client==0.21.1",
    "alembic",
]

[project.optional-dependencies]
gui = [
    "dearpygui",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]